<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Microbiology Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#f6f7f4; --ink:#1b2028; --ink-soft:#2c343c; --muted:#5d666e; --faint:#8a9199;
  --line:#e4e7e2; --card:#fff; --opt:#fbfcfa; --chip:#eef0ed; --chip-ink:#7d8790;
  --hero:#141a1f; --hero-ink:#eef2f0; --hero-muted:#8fa0a8;
  --accent:#2563eb; --ok:#16a34a; --ok-ink:#14532d; --ok-bg:#f3faf5; --ok-line:#a7d8ba;
  --bad:#dc2626; --bad-ink:#7f1d1d; --bad-bg:#fef4f4; --bad-line:#f0a3a3;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
body{background:var(--page);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding:0 20px}

header{background:var(--hero);padding:34px 0 30px}
.kicker{font-family:var(--sans);font-size:12px;color:var(--hero-muted)}
h1{font-size:34px;font-weight:400;letter-spacing:-.015em;color:var(--hero-ink);margin:.35rem 0 .5rem}
.lede{font-family:var(--sans);font-size:13.5px;color:var(--hero-muted);max-width:56ch;line-height:1.6}
.stats{display:flex;gap:38px;margin-top:22px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--serif);font-size:27px;font-weight:400;color:var(--hero-ink)}
.stat span{font-family:var(--sans);font-size:12px;color:var(--hero-muted)}

main{padding:26px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.lead-card{border-left:4px solid var(--accent);display:flex;align-items:center;
  justify-content:space-between;gap:20px;flex-wrap:wrap}
.lead-card .label{font-family:var(--sans);font-size:11.5px;color:var(--accent)}
.lead-card h2{font-size:21px;font-weight:400;margin:.15rem 0}
.lead-card .meta{font-family:var(--sans);font-size:12.5px;color:var(--faint)}
.btn{font-family:var(--sans);font-size:15px;font-weight:600;color:#fff;background:var(--accent);
  border:none;border-radius:7px;padding:13px 22px;min-height:44px;cursor:pointer}
.btn:hover{background:#1d4ed8}
.btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--chip)}
.btn.wide{width:100%;border-radius:8px;padding:14px}

.section-title{font-family:var(--sans);font-size:12.5px;color:var(--faint);margin:26px 0 10px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.unit{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);
  border-radius:10px;padding:16px 18px;text-align:left;cursor:pointer;font-family:var(--serif);
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;width:100%}
.unit:hover{border-color:var(--accent)}
.unit h3{font-size:18px;font-weight:400;margin:.1rem 0}
.unit .meta{font-family:var(--sans);font-size:12.5px;color:var(--faint)}
.score-ring{font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--chip-ink);
  border:1px solid var(--line);border-radius:999px;padding:5px 9px;white-space:nowrap}
.score-ring.done{color:var(--accent);border-color:var(--accent)}

.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 0 0}
.topbar .row{display:flex;align-items:center;gap:14px}
.close{font-family:var(--sans);font-size:20px;line-height:1;color:var(--faint);background:none;
  border:none;cursor:pointer;min-width:44px;min-height:44px}
.close:hover{color:var(--ink)}
.crumb{font-family:var(--sans);font-size:12.5px;color:var(--muted);flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--muted)}
.progress{height:2px;background:var(--line);margin-top:10px}
.progress i{display:block;height:2px;background:var(--accent);transition:width .2s ease-out}

.qcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px 24px 22px;margin-top:26px}
.qtopic{font-family:var(--sans);font-size:11.5px;color:var(--accent)}
.qtext{font-size:20px;font-weight:400;margin:.4rem 0 1.1rem;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--opt);
  border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-height:48px;cursor:pointer;
  font-family:var(--serif);font-size:15.5px;line-height:1.45;color:var(--ink-soft)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .num{flex:none;width:25px;height:25px;border-radius:6px;background:var(--chip);color:var(--chip-ink);
  font-family:var(--sans);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.opt.right{border-color:var(--ok);color:var(--ok-ink)}
.opt.right .num{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);color:var(--bad-ink)}
.opt.wrong .num{background:var(--bad);color:#fff}
.opt.dim{color:#a0a8ae}
.feedback{border:1px solid var(--bad-line);background:var(--bad-bg);border-radius:8px;padding:14px 18px;margin-top:16px}
.feedback.ok{border-color:var(--ok-line);background:var(--ok-bg)}
.feedback b{display:block;font-family:var(--sans);font-size:13.5px;font-weight:700;color:var(--bad);margin-bottom:.3rem}
.feedback.ok b{color:var(--ok)}
.hint{font-family:var(--sans);font-size:11.5px;color:#b3bac0;text-align:center;margin-top:12px}
.done-score{font-size:40px;font-weight:400}
.done-meta{font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:.3rem}
.done-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.links{font-family:var(--sans);font-size:12.5px;margin-top:14px}
.links a{color:var(--hero-muted);text-decoration:none;margin-right:16px}
.links a:hover{color:var(--hero-ink);text-decoration:underline}
.home{background:var(--hero);padding:10px 16px}
.home a{display:inline-block;color:var(--hero-ink);font:600 13px var(--sans);text-decoration:none;
  padding:8px 14px;border:1px solid #3a454d;border-radius:999px}
.home a:hover{background:#232c33}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){h1{font-size:27px}.qcard{padding:20px 16px}.stats{gap:24px}}
</style>
</head>
<body>
<nav class="home"><a href="index.html">&larr; Back to quiz</a></nav>

<script>
const QZ_TOPICS = {"world": "Microbial world", "bact": "Bacteria", "arch": "Archaea", "euk": "Eukaryal microbes", "virus": "Viruses", "cult": "Cultivation", "mvp": "Bacterial MVPs", "reg": "Gene regulation", "bgen": "Bacterial genetics", "gnom": "Genomics"};
// [topic, prompt, options, index of the correct option, explanation]
const QB = [
["world", "Which molecule did Woese use to separate Archaea from Bacteria?", ["Small subunit ribosomal RNA sequence", "The beta subunit of RNA polymerase", "Cytochrome c from the membrane", "Elongation factor Tu protein"], 0, "16S and 18S rRNA are universal, functionally constant and slow changing, so they work as a molecular clock across all life."],
["world", "Which stereoisomer of glycerol phosphate carries archaeal membrane lipids?", ["Glycerol-1-phosphate", "Glycerol-3-phosphate", "Glycerol-2-phosphate", "Glycerol-6-phosphate"], 0, "Archaea build on glycerol-1-phosphate, the mirror image of the glycerol-3-phosphate used by bacteria and eukaryotes."],
["world", "Which bond joins the hydrocarbon chains to glycerol in an archaeon?", ["An ether bond", "An ester bond", "An amide bond", "A thioester bond"], 0, "Ether bonds resist hydrolysis at high temperature and low pH, which suits the habitats many archaea occupy."],
["world", "Which feature groups Archaea with Eukarya rather than with Bacteria?", ["Histones packaging the chromosome", "Operons with polycistronic mRNA", "A single circular chromosome", "Chemiosmotic energy conservation"], 0, "Information processing is eukaryote-like in archaea, while metabolism and genome layout stay bacterial."],
["world", "An organism uses light for energy, hydrogen sulfide as electron donor and carbon dioxide for carbon. What is it?", ["A photolithoautotroph", "A chemolithoautotroph", "A photoorganoheterotroph", "A chemoorganoheterotroph"], 0, "The three parts of the label report energy source, electron donor and carbon source in that order."],
["world", "Which organisms carry out the first step of nitrification?", ["Nitrosomonas and relatives", "Nitrobacter and relatives", "Rhizobium and relatives", "Desulfovibrio and relatives"], 0, "Nitrosomonas oxidises ammonia to nitrite; Nitrobacter then oxidises nitrite to nitrate."],
["world", "Which process is carried out only by archaea?", ["Methanogenesis", "Denitrification", "Nitrification", "Photosynthesis"], 0, "No bacterium or eukaryote produces methane; the other three processes are all found in bacteria."],
["world", "Anammox bacteria combine which two substrates?", ["Ammonium and nitrite", "Ammonium and sulfate", "Nitrate and methane", "Nitrite and hydrogen"], 0, "Anaerobic ammonium oxidation converts ammonium plus nitrite straight to dinitrogen gas."],
["world", "Why do cells inside a biofilm survive high doses of antibiotic?", ["The matrix slows entry and interior cells grow slowly", "Every cell in the matrix carries a resistance plasmid", "The matrix chemically destroys the drug on contact", "Biofilm cells switch to an entirely archaeal envelope"], 0, "Tolerance can be a thousandfold higher than for planktonic cells without any change in genotype."],
["world", "Which statement about Koch's first postulate is correct?", ["Asymptomatic carriers violate it", "Uncultivable pathogens satisfy it", "It applies to viruses only", "Healthy tissue always stays sterile"], 0, "Healthy carriers of Salmonella or Neisseria harbour the organism without disease, so the postulate fails."],
["world", "What do molecular Koch's postulates test instead of the organism?", ["A candidate virulence gene", "A serum antibody response", "A colony morphology change", "A ribosomal RNA sequence"], 0, "Inactivating the gene should reduce virulence and restoring it should bring virulence back."],
["world", "Which description fits endotoxin rather than exotoxin?", ["Heat stable and released on lysis", "Secreted and specific in its target", "Lethal in nanogram quantities", "Convertible into a toxoid vaccine"], 0, "Endotoxin is the lipid A of LPS, a structural component, so it cannot be turned into a toxoid."],
["world", "What does a siderophore do for a pathogen?", ["Captures iron from host proteins", "Blocks phagocytosis by the host", "Degrades host antibody molecules", "Anchors the cell to host tissue"], 0, "Enterobactin and similar chelators strip iron from transferrin and lactoferrin."],
["world", "Which term describes a pathogen that only causes disease when defences fail?", ["Opportunistic pathogen", "Intracellular parasite", "Systemic pathogen", "Zoonotic reservoir"], 0, "Pseudomonas aeruginosa and Candida albicans are harmless in most people and dangerous in a compromised host."],
["world", "Roughly what fraction of the Escherichia coli chromosome encodes protein?", ["About 88 per cent", "About 45 per cent", "About 25 per cent", "About 8 per cent"], 0, "Bacterial genomes are gene dense, unlike the human genome where coding sequence is a few per cent."],
["world", "Why do endosymbionts such as Carsonella have tiny genomes?", ["The host supplies what the pathways made", "Small cells cannot copy long chromosomes fast", "Their polymerases have no proofreading capacity", "Symbionts shed DNA during host transmission"], 0, "Genes for biosynthesis decay to pseudogenes and are lost once the host provides the product."],
["world", "Which measurement now defines a bacterial species?", ["Average nucleotide identity", "Guanine cytosine content", "Colony morphology comparison", "Doubling time measurement"], 0, "Whole-genome identity above roughly 95 per cent is treated as one species, replacing DNA hybridisation."],
["world", "What limits the resolution of a light microscope to about 0.2 micrometres?", ["The wavelength of visible light", "The refractive index of glass", "The thickness of the specimen", "The intensity of the light source"], 0, "Anything below that limit needs electron microscopy, which is why viruses stayed hypothetical for decades."],
["world", "Which cell is the largest bacterium known?", ["Thiomargarita namibiensis", "Mycoplasma genitalium", "Escherichia coli K-12", "Prochlorococcus marinus"], 0, "It reaches 750 micrometres, though most of that volume is a storage vacuole rather than cytoplasm."],
["world", "Why does a small cell grow faster than a large one?", ["A high surface to volume ratio", "A shorter chromosome to copy out", "A lower demand for ribosome production", "A thinner wall to build each time"], 0, "More membrane per unit of cytoplasm means faster exchange of nutrients and waste."],
["bact", "Which protein forms the ring that marks the bacterial division site?", ["FtsZ", "MreB", "CreS", "ParA"], 0, "FtsZ is the tubulin homologue; it polymerises at midcell and recruits the rest of the divisome."],
["bact", "Which cytoskeletal protein maintains rod shape and is absent from cocci?", ["MreB", "FtsZ", "CreS", "FtsA"], 0, "MreB is the actin homologue and directs where new wall material is inserted along the cylinder."],
["bact", "What keeps the Z ring from assembling near a cell pole?", ["The oscillating MinCDE system", "The nucleoid occlusion effect", "The polar MreB anchoring", "The methylation of oriC"], 0, "MinC oscillates pole to pole as an inhibitor, leaving midcell as the only permissive site."],
["bact", "Which bond does lysozyme hydrolyse in the bacterial wall?", ["The beta-1,4 bond between sugars", "The lipid II carrier linkage", "The 3-position peptide cross bridge", "The teichoic acid phosphodiester link"], 0, "Lysozyme cuts between N-acetylmuramic acid and N-acetylglucosamine, collapsing the sacculus."],
["bact", "What do penicillin and the other beta-lactams inhibit?", ["Peptide stem cross-linking", "Glycan chain polymerisation", "Lipid carrier recycling", "Teichoic acid attachment"], 0, "Penicillin binding proteins cannot knit the peptide stems together, so the cell lyses under turgor."],
["bact", "Which part of the wall does vancomycin bind?", ["The D-alanyl-D-alanine terminus", "The N-acetylmuramic acid ring", "The diaminopimelic acid stem", "The pentaglycine bridge"], 0, "It blocks cross-linking from the substrate side, and it is too large to cross a Gram-negative outer membrane."],
["bact", "Why does a Gram-positive cell keep the crystal violet stain?", ["Alcohol shrinks its thick peptidoglycan", "Iodine cannot penetrate thin walls", "Its membrane binds the dye covalently", "Safranin displaces the dye more slowly"], 0, "The dehydrated mesh traps the dye and iodine complex, while alcohol dissolves the Gram-negative outer membrane."],
["bact", "Which layer carries the endotoxin activity of a Gram-negative cell?", ["Lipid A of the lipopolysaccharide", "The O antigen sugar repeats", "The core polysaccharide region", "The peptidoglycan cross bridges"], 0, "Lipid A triggers fever, inflammation and septic shock through the innate immune system."],
["bact", "What is the O antigen used for in the clinic?", ["Serotyping a Gram-negative isolate", "Measuring the thickness of the wall", "Predicting beta-lactam sensitivity", "Distinguishing archaea from bacteria"], 0, "The variable sugar repeat gives names such as Escherichia coli O157:H7."],
["bact", "Which structure makes mycobacteria acid-fast?", ["A mycolic acid outer layer", "A thick capsule of protein", "An unusually dense S-layer", "A double outer membrane"], 0, "The waxy layer retains carbolfuchsin through acid alcohol and also slows nutrient uptake and drug entry."],
["bact", "What powers the rotation of a bacterial flagellum?", ["The proton-motive force", "Hydrolysis of stored ATP", "A calcium ion gradient", "Sliding filament subunits"], 0, "MotA and MotB conduct protons across the membrane and turn the rotor; the archaellum uses ATP instead."],
["bact", "Which arrangement describes flagella distributed over the whole cell?", ["Peritrichous", "Lophotrichous", "Amphitrichous", "Monotrichous"], 0, "Escherichia coli is peritrichous, which lets its filaments bundle into one propeller during a run."],
["bact", "What does the H antigen of a serotype refer to?", ["Flagellar protein antigen", "Capsular polysaccharide", "Lipopolysaccharide sugar", "Fimbrial adhesin tip"], 0, "O is the LPS sugar chain, H is flagellin and K is the capsule."],
["bact", "Which surface structure is used both for twitching motility and for DNA uptake?", ["The type IV pilus", "The F sex pilus", "The polar flagellar hook", "A short curli fibre"], 0, "Retraction of the pilus pulls the cell forward and also draws DNA across the envelope."],
["bact", "What is inside a carboxysome?", ["Rubisco and carbonic anhydrase", "Magnetite crystals in a chain", "Stored polyhydroxybutyrate", "Gas at atmospheric pressure"], 0, "The protein shell concentrates carbon dioxide around rubisco in autotrophs."],
["bact", "How many endospores does one sporulating cell produce?", ["Exactly one", "Precisely two", "Four spores", "Eight spores"], 0, "Sporulation is survival rather than reproduction, which is why it does not increase cell numbers."],
["bact", "Which component is responsible for the dehydrated core of an endospore?", ["Calcium dipicolinate", "Lipoteichoic acid", "Poly-beta-hydroxybutyrate", "N-acetylmuramic acid"], 0, "Dipicolinic acid chelated with calcium replaces water and stabilises the DNA with small acid-soluble proteins."],
["bact", "Which organism has no cell wall at all?", ["Mycoplasma", "Mycobacterium", "Streptococcus", "Pseudomonas"], 0, "It keeps sterols in its membrane instead, so it is pleomorphic and untouched by beta-lactams."],
["bact", "What is an S-layer made of?", ["Self-assembling protein subunits", "Branched isoprenoid lipid bilayers", "Long repeating teichoic acid chains", "Cross-linked glycan strands"], 0, "The paracrystalline sheet is the outermost layer of many archaea and some bacteria."],
["bact", "Which phylum contains Streptomyces, Mycobacterium and Corynebacterium?", ["Actinobacteria", "Firmicutes", "Proteobacteria", "Bacteroidetes"], 0, "They are the Gram-positive bacteria with high GC content, several of them filamentous."],
["arch", "Which archaeal genes group with eukaryotes rather than with bacteria?", ["Informational genes", "Operational genes", "Transport genes", "Biosynthetic genes"], 0, "Replication, transcription and translation are eukaryote-like; metabolism stays bacterial."],
["arch", "What does the two-domain hypothesis claim?", ["Eukaryotes arose from within the archaea", "Archaea arose from within the eukaryotes", "Bacteria and archaea share one domain", "Eukaryotes predate both prokaryotic groups"], 0, "On this model eukaryotes are a branch inside the Asgard archaea, so there are two primary domains."],
["arch", "Which proteins in Asgard genomes support that argument?", ["Actin, profilin and ESCRT components", "Tubulin, myosin and kinesin motors", "Histone, ligase and gyrase enzymes", "Porin, flagellin and pilin subunits"], 0, "These eukaryotic signature proteins were unexpected in an archaeon and imply a shared ancestry."],
["arch", "What is unusual about the membrane of a hyperthermophilic archaeon?", ["The chains span it as a monolayer", "The chains carry no branches at all", "It contains no lipid whatsoever", "It carries cholesterol for rigidity"], 0, "Tetraether lipids fuse the two leaflets, so heat cannot pull the membrane apart."],
["arch", "Which wall polymer replaces peptidoglycan in Methanobacterium?", ["Pseudomurein", "Methanochondroitin", "Arabinogalactan", "Lipoteichoic acid"], 0, "It uses N-acetyltalosaminuronic acid with beta-1,3 links and L-amino acids, so lysozyme has no effect."],
["arch", "Why do beta-lactam antibiotics fail against archaea?", ["They make no peptidoglycan", "Their walls are extremely thick", "They pump the drug out", "Their ribosomes are unusual"], 0, "There are no transpeptidases to inhibit, so the drug has no target."],
["arch", "How does the archaellum differ from a bacterial flagellum?", ["It is driven by ATP hydrolysis", "It bends rather than rotating", "It is built from tubulin subunits", "It grows from the distal tip outward"], 0, "It is assembled from type IV pilus components and adds subunits at the base, not the tip."],
["arch", "Which archaea divide using a system related to eukaryotic ESCRT-III?", ["Crenarchaeota", "Euryarchaeota", "Thaumarchaeota", "Nanoarchaeota"], 0, "They use the Cdv proteins, while Euryarchaeota keep the bacterial FtsZ machinery."],
["arch", "What do methanogens require of their environment?", ["Strict absence of oxygen", "Salt above three molar", "A pH below two units", "Pressure above 400 atmospheres"], 0, "They are killed by oxygen, so they live in rumen, wetlands, digesters and the gut."],
["arch", "How does Halobacterium balance a saturated brine?", ["It accumulates molar potassium chloride", "It accumulates compatible cytoplasmic solutes", "It stores fresh water inside a large vacuole", "It excludes salt using dedicated ion pumps"], 0, "Its enzymes actually require the high internal salt, unlike those of most halotolerant organisms."],
["arch", "What does bacteriorhodopsin do?", ["Pumps protons using light energy", "Fixes carbon dioxide into sugar", "Splits water to release oxygen", "Reduces nitrate to nitrogen gas"], 0, "It is a light-driven proton pump, not a photosystem, and it makes no oxygen and no NADPH."],
["arch", "Which archaea oxidise ammonia in the open ocean?", ["Thaumarchaeota", "Halobacteria", "Methanogens", "Nanoarchaeota"], 0, "Ammonia-oxidising archaea have a very high affinity for ammonia and are among the most abundant cells alive."],
["arch", "What do the ANME groups of archaea do?", ["Oxidise methane without oxygen", "Produce methane from acetate", "Fix nitrogen in marine sediment", "Reduce sulfate to hydrogen sulfide"], 0, "They usually work in syntrophy with sulfate reducers and form a major global methane sink."],
["arch", "What is unusual about Nanoarchaeum equitans?", ["It grows only attached to another archaeon", "It has the largest archaeal genome known", "It is the only archaeon with peptidoglycan", "It divides by budding rather than fission"], 0, "It is a member of DPANN, with a genome under half a megabase and an obligate host requirement."],
["arch", "Which archaeon grows at the lowest pH recorded?", ["Picrophilus torridus", "Sulfolobus solfataricus", "Pyrolobus fumarii", "Thermoplasma volcanium"], 0, "It grows at pH zero, and its cytoplasm is still held near neutral by pumps and antiporters."],
["arch", "Which organism holds the record for growth at high temperature?", ["Pyrolobus fumarii", "Thermus aquaticus", "Geobacillus stearothermophilus", "Deinococcus radiodurans"], 0, "It grows at 113 degrees at hydrothermal vents, well above the boiling point at surface pressure."],
["arch", "Which superphylum contains Thaumarchaeota and Crenarchaeota?", ["TACK", "DPANN", "Asgard", "Euryarchaeota"], 0, "The name is an acronym of the four founding groups: Thaumarchaeota, Aigarchaeota, Crenarchaeota and Korarchaeota."],
["arch", "Why were archaea once thought to live only in extreme places?", ["Culture methods favoured thermophiles", "Mesophilic archaea lack ribosomal genes", "Culture-independent methods were unavailable", "Enrichment cultures favoured hyperthermophiles"], 0, "Sequencing later found them throughout the ocean, soil and animal guts."],
["arch", "How many human diseases are confirmed to be caused by archaea?", ["None so far", "About a dozen", "Roughly fifty", "Several hundred"], 0, "Methanogens are normal members of gut and oral flora, but no archaeon is an established pathogen."],
["arch", "Which transcription factors do archaea use?", ["TBP and TFB, as eukaryotes do", "Sigma factors, as bacteria do", "Nuclear receptors and coactivators", "No factors, the polymerase acts alone"], 0, "The archaeal polymerase has eight to twelve subunits and eukaryote-like basal factors."],
["euk", "Which supergroup contains the fungi?", ["Opisthokonta", "Amoebozoa", "Excavata", "Archaeplastida"], 0, "Fungi sit with animals and choanoflagellates, so animals are closer relatives of fungi than of plants."],
["euk", "What is a hydrogenosome?", ["A mitochondrion that makes hydrogen", "A vesicle storing hydrogen gas", "A plastid that lost its pigment", "A vacuole that acidifies the cell"], 0, "Trichomonas uses it for anaerobic ATP production; it has no cristae and no genome."],
["euk", "Which organelle does Giardia retain in place of a mitochondrion?", ["A reduced mitosome", "A hydrogenosome", "A tiny peroxisome", "A glycosome"], 0, "The mitosome has lost energy metabolism and only assembles iron-sulfur clusters."],
["euk", "What is the apicoplast of Plasmodium derived from?", ["A secondary plastid endosymbiont", "A degenerate mitochondrion", "An invaginated nuclear envelope", "A captured bacteriophage genome"], 0, "It no longer photosynthesises but retains pathways that make it a useful drug target."],
["euk", "Which membrane sterol do antifungal azoles target?", ["Ergosterol", "Cholesterol", "Stigmasterol", "Hopanoid"], 0, "Fungi use ergosterol where animals use cholesterol, which is one of the few exploitable differences."],
["euk", "What does a dimorphic fungus do?", ["Grows as a mould at 25 and a yeast at 37", "Divides by fission at 25 and then it buds at 37", "Makes spores at 25 and hyphae at 37 degrees", "Fixes carbon at 25 and nitrogen at 37 degrees"], 0, "Histoplasma and Blastomyces are inhaled as mould spores from soil and convert to yeast in tissue."],
["euk", "Which term describes hyphae with no cross walls?", ["Coenocytic", "Septate", "Pseudohyphal", "Dikaryotic"], 0, "Rhizopus is coenocytic, so the cytoplasm and many nuclei are continuous along the filament."],
["euk", "Where does an ascomycete form its sexual spores?", ["Inside a sac called an ascus", "On the surface of a basidium", "Within a motile zoospore", "In an arbuscule inside a root"], 0, "Saccharomyces, Aspergillus, Penicillium and Neurospora are all ascomycetes."],
["euk", "Which fungal phylum forms arbuscular mycorrhizae?", ["Glomeromycota", "Basidiomycota", "Chytridiomycota", "Zygomycota"], 0, "They are obligate symbionts and cannot be grown apart from a plant root."],
["euk", "How does budding differ from binary fission?", ["The daughter cell starts smaller", "The daughter cell has no nucleus", "No DNA replication takes place", "The parent cell dies afterwards"], 0, "Saccharomyces buds asymmetrically and leaves a bud scar, unlike the equal split of fission yeast."],
["euk", "Which host of the malaria parasite is the definitive host?", ["The mosquito", "The human", "The liver cell", "The red blood cell"], 0, "The definitive host is where sexual reproduction happens, and the only meiosis occurs in the mosquito midgut."],

["gnom", "What is a scaffold?", ["Ordered contigs with sized gaps", "A single gapless circular sequence", "A raw read before trimming", "A predicted open reading frame"], 0, "Paired-end or long reads supply the order and spacing between contigs."],
["gnom", "How is gene function usually assigned during annotation?", ["By homology to known sequences", "By measuring the protein abundance", "By knocking out each gene", "By watching the colony morphology"], 0, "BLAST searches and profile models place genes into COG or KEGG categories."],
["gnom", "What is a hypothetical protein?", ["A predicted gene with no known function", "A protein that was never actually translated", "A sequence found only in archaeal genomes", "An enzyme that works only in a test tube"], 0, "They are still 20 to 40 per cent of a typical genome, which measures how much remains unknown."],
["gnom", "Which was the first genome sequenced from a free-living organism?", ["Haemophilus influenzae", "Escherichia coli", "Mycoplasma genitalium", "Saccharomyces cerevisiae"], 0, "It was completed in 1995 by whole genome shotgun sequencing."],
["gnom", "What can RNA-seq find that a microarray cannot?", ["Small RNAs and antisense transcripts", "Abundance of a known transcript", "Differences between two conditions", "The identity of a labelled probe"], 0, "It requires no prior knowledge of what sequences to look for."],
["gnom", "Why must ribosomal RNA be depleted before RNA-seq?", ["It is most of the RNA in the cell", "It would use up most of the run itself", "It cannot be reverse transcribed at all", "It sticks to the sequencing adapters"], 0, "Without depletion the run is spent sequencing rRNA rather than the transcripts of interest."],
["gnom", "What does Tn-seq measure?", ["Which genes are essential under a condition", "Which promoters a given regulator binds tightly", "How many copies of each plasmid exist in a cell", "Which proteins interact with one another directly"], 0, "Genes with no recovered insertions after selection are the ones the cell cannot lose."],
["gnom", "What does ChIP-seq map?", ["Binding sites of one protein on DNA", "Sites of RNA cleavage by a nuclease", "Positions of methylation in a genome", "Contacts between two chromosomes"], 0, "It turns a proposed regulon into an actual list of targets."],
["gnom", "What is the core genome of a species?", ["Genes present in every strain", "Genes unique to one strain", "All genes across all strains", "Genes acquired horizontally"], 0, "The accessory genome varies between strains, and the two together make the pan genome."],
["gnom", "What does an open pan genome mean?", ["Each new strain adds more new genes", "The species has no accessory genes", "All strains share the same genes", "The genome is being reduced over time"], 0, "Escherichia coli is open; Bacillus anthracis is closed because new isolates add almost nothing."],
["gnom", "How do orthologues differ from paralogues?", ["Orthologues separate by speciation", "Orthologues separate by duplication", "Paralogues occur in different species", "Paralogues are always pseudogenes"], 0, "Paralogues arise by duplication within one genome and often diverge in function."],
["gnom", "What is synteny?", ["Conserved gene order between genomes", "Shared codon usage between species", "Equal genome size in two strains", "Identical GC content across a genus"], 0, "Loss of synteny suggests rearrangement or horizontal acquisition."],
["gnom", "Why do amplicon surveys of 16S rRNA have limits?", ["They give taxonomy but not function", "They cannot detect archaea at all", "They need cultivation beforehand", "They only work on marine samples"], 0, "Primer bias and variable copy number also distort the picture, and resolution often stops at genus."],
["gnom", "What is a metagenome-assembled genome?", ["A draft binned from community sequence", "A genome sequenced from a single pure colony", "A reference assembled from many strains", "A plasmid recovered from an environmental sample"], 0, "Binning uses coverage and composition, and most new phyla are known only this way."],
["gnom", "How does an ASV differ from an OTU?", ["It is an exact error-corrected sequence", "It is a threshold-based sequence cluster", "It contains only functional gene sequences", "It represents one complete bacterial genome"], 0, "Because ASVs are exact, they can be compared directly between separate studies."],
["gnom", "What does beta diversity describe?", ["Difference in composition between samples", "Richness and evenness within one sample", "Total number of reads per sample", "Rate of new species discovery"], 0, "UniFrac and Bray-Curtis distances are usually shown as an ordination plot."],
["gnom", "Why is rarefaction applied to diversity data?", ["To compare samples at equal depth", "To remove chimeric sequences from data", "To correct for primer mismatch bias", "To merge the paired-end reads"], 0, "A sample sequenced more deeply looks more diverse unless libraries are subsampled to match."]
];

(function(){
  const $ = s => document.querySelector(s);
  const app = $("#app"), bar = $("#topbar");
  const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(p => p[1]);
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

  let pool = [], at = 0, right = 0, chosen = -1, opts = [], label = "";

  const best = () => { try { return JSON.parse(localStorage.getItem("microQuiz") || "{}"); } catch (e) { return {}; } };
  const save = (key, pct) => {
    try {
      const b = best();
      if(!(key in b) || pct > b[key]) b[key] = pct;
      localStorage.setItem("microQuiz", JSON.stringify(b));
    } catch (e) {}
  };

  function home(){
    bar.hidden = true;
    const b = best(), keys = Object.keys(QZ_TOPICS);
    const attempted = keys.filter(k => k in b).length;
    const scores = keys.filter(k => k in b).map(k => b[k]);
    const avg = scores.length ? Math.round(scores.reduce((x, y) => x + y, 0) / scores.length) + "%" : "\u2014";
    app.innerHTML =
      '<header><div class="wrap">' +
        '<p class="kicker">Microbiology, ten course topics</p>' +
        '<h1>Microbiology quiz</h1>' +
        '<p class="lede">Twenty questions sit behind each topic. Options are matched for length and format, ' +
          'so the answer never gives itself away.</p>' +
        '<div class="stats">' +
          '<div class="stat"><b>' + QB.length + '</b><span>questions</span></div>' +
          '<div class="stat"><b>' + attempted + '/' + keys.length + '</b><span>topics attempted</span></div>' +
          '<div class="stat"><b>' + avg + '</b><span>best average</span></div>' +
        '</div>' +
        '<p class="links">' +
          '<a href="microbiology.html">Microbiology content</a>' +
          '<a href="biology-review.html">Biology review</a></p>' +
      '</div></header>' +
      '<main><div class="wrap">' +
        '<div class="card lead-card">' +
          '<div><p class="label">Everything at once</p><h2>All ten topics</h2>' +
          '<p class="meta">' + QB.length + ' questions, shuffled</p></div>' +
          '<button class="btn" data-start="all">Start quiz</button>' +
        '</div>' +
        '<p class="section-title">Course topics</p>' +
        '<div class="units">' +
          keys.map(k => {
            const n = QB.filter(q => q[0] === k).length;
            const done = k in b;
            return '<button class="unit" data-start="' + k + '">' +
              '<span><span class="meta">' + n + ' questions</span><h3>' + QZ_TOPICS[k] + '</h3></span>' +
              '<span class="score-ring' + (done ? " done" : "") + '">' + (done ? b[k] + "%" : "new") + '</span>' +
            '</button>';
          }).join("") +
        '</div>' +
      '</div></main>';
  }

  function start(topic){
    label = topic === "all" ? "All ten topics" : QZ_TOPICS[topic];
    pool = shuffle(QB.filter(q => topic === "all" || q[0] === topic));
    pool.key = topic;
    at = 0; right = 0;
    question();
  }

  function question(){
    chosen = -1;
    const q = pool[at];
    opts = shuffle(q[2].slice());
    bar.hidden = false;
    bar.innerHTML =
      '<div class="wrap"><div class="row">' +
        '<button class="close" aria-label="Leave the quiz">\u00d7</button>' +
        '<span class="crumb">' + esc(label) + '</span>' +
        '<span class="count">' + (at + 1) + '/' + pool.length + '</span>' +
      '</div><div class="progress"><i style="width:' + (100 * at / pool.length) + '%"></i></div></div>';
    app.innerHTML =
      '<main><div class="wrap"><div class="qcard">' +
        '<p class="qtopic">' + esc(QZ_TOPICS[q[0]]) + '</p>' +
        '<p class="qtext">' + esc(q[1]) + '</p>' +
        '<div class="opts">' + opts.map((o, i) =>
          '<button class="opt" data-i="' + i + '"><span class="num">' + (i + 1) + '</span>' +
          '<span>' + esc(o) + '</span></button>').join("") + '</div>' +
        '<div id="tail"></div>' +
        '<p class="hint">Press 1 to 4 to answer, Enter to continue</p>' +
      '</div></div></main>';
  }

  function answer(i){
    if(chosen !== -1 || !opts[i]) return;
    chosen = i;
    const q = pool[at], correct = q[2][q[3]], hit = opts[i] === correct;
    if(hit) right++;
    document.querySelectorAll(".opt").forEach((b, j) => {
      b.disabled = true;
      const num = b.querySelector(".num");
      if(opts[j] === correct){ b.classList.add("right"); num.textContent = "\u2713"; }
      else if(j === i){ b.classList.add("wrong"); num.textContent = "\u2715"; }
      else b.classList.add("dim");
    });
    $("#tail").innerHTML =
      '<div class="feedback' + (hit ? " ok" : "") + '"><b>' + (hit ? "Correct" : "Not quite") + '</b>' +
      esc(q[4]) + '</div>' +
      '<button class="btn wide" id="next" style="margin-top:16px">' +
      (at + 1 === pool.length ? "See your score" : "Next question") + '</button>';
    $("#next").focus();
  }

  function next(){
    if(chosen === -1) return;
    at++;
    if(at < pool.length) return question();
    const pct = Math.round(100 * right / pool.length);
    save(pool.key, pct);
    bar.hidden = true;
    app.innerHTML =
      '<main><div class="wrap"><div class="qcard">' +
        '<p class="qtopic">' + esc(label) + '</p>' +
        '<p class="done-score">' + right + ' / ' + pool.length + '</p>' +
        '<p class="done-meta">' + pct + ' per cent' +
          (pct === 100 ? ", every one" : pct >= 80 ? ", solid" : pct >= 60 ? ", worth another pass" : ", go back over this topic") +
        '</p>' +
        '<div class="done-btns">' +
          '<button class="btn" id="again">Run it again</button>' +
          '<button class="btn ghost" id="back">Back to topics</button>' +
        '</div>' +
      '</div></div></main>';
    $("#again").addEventListener("click", () => start(pool.key));
    $("#back").addEventListener("click", home);
  }

  document.addEventListener("click", e => {
    const s = e.target.closest("[data-start]");
    if(s) return start(s.dataset.start);
    if(e.target.closest(".close")) return home();
    const o = e.target.closest(".opt");
    if(o) return answer(+o.dataset.i);
    if(e.target.id === "next") return next();
  });

  document.addEventListener("keydown", e => {
    if(!pool.length || bar.hidden) return;
    if(e.key >= "1" && e.key <= "4") answer(+e.key - 1);
    else if(e.key === "Enter" && chosen !== -1){ e.preventDefault(); next(); }
    else if(e.key === "Escape") home();
  });

  home();

  // ponytail: self-check, run by loading the page with #selftest
  if(location.hash === "#selftest"){
    QB.forEach(([t, prompt, opts, correct, expl]) => {
      console.assert(opts.length === 4, "not four options", prompt);
      console.assert(new Set(opts).size === 4, "duplicate option", prompt);
      console.assert(typeof opts[correct] === "string", "bad correct index", prompt);
      console.assert(expl && expl.length > 20, "thin explanation", prompt);
      console.assert(t in QZ_TOPICS, "unknown topic", t);
      const lens = opts.map(o => o.length).sort((a, b) => a - b);
      const ans = opts[correct].length;
      console.assert(!(ans === lens[3] && ans - lens[2] > 4), "answer longest by too much", prompt);
      console.assert(!(ans === lens[0] && lens[1] - ans > 4), "answer shortest by too much", prompt);
    });
    console.log("selftest done:", QB.length, "questions");
  }
})();
</script>
</body>
</html>
