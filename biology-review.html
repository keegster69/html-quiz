undant macromolecule, but water outweighs it.","Cell composition"),a("Archaea were recognized as a separate domain largely on the basis of what evidence?","Their ability to grow at high temperature","Ribosomal RNA sequence comparisons","The absence of a cell wall","Their use of a different genetic code","b","Woese compared small subunit rRNA sequences, which showed archaea are as distinct from bacteria as from eukaryotes.","Domains of life"),a("A cell is found to lack a nucleus but contains a cell wall and a single circular chromosome. What can you conclude?","It is definitely a bacterium, since only bacteria combine a wall with circular DNA","It is definitely an archaeon, because archaea are the only walled cells without a nucleus","It is a prokaryote, but bacteria and archaea are not distinguishable from this","It must be a eukaryote that lost its nucleus during an earlier symbiotic event","c","Those features are common to both prokaryotic domains. Distinguishing them requires membrane lipid or sequence data.","Prokaryote structure"),a("Which organelle is the site of most ATP synthesis in a eukaryotic cell?","Rough endoplasmic reticulum","Golgi apparatus","Mitochondrion","Lysosome","c","Oxidative phosphorylation occurs on the mitochondrial inner membrane, producing the bulk of cellular ATP.","Organelles"),a("Why is E. coli a favored model organism in molecular biology?","It has the smallest genome of any organism studied in a laboratory setting","It divides rapidly, is easy to grow, and is readily manipulated genetically","Its cells closely resemble human cells","It cannot exchange DNA with other cells","b","Fast doubling time, cheap culture, and powerful genetics make E. coli tractable. Its cells differ substantially from human cells.","Model organisms"),a("Roughly what fraction of a cell dry weight is protein?","About 5 percent","About 15 percent","About 50 percent","About 90 percent","c","Protein dominates cell dry weight at roughly half, reflecting how much of cellular function is protein-based.","Cell composition"),a("Which four elements make up the great majority of atoms in living cells?","Carbon, hydrogen, oxygen, nitrogen","Carbon, sulfur, phosphorus, iron","Sodium, potassium, chlorine, calcium","Hydrogen, helium, oxygen, silicon","a","C, H, O, and N account for about 96 percent of atoms. Phosphorus and sulfur are essential but far less abundant.","Elemental composition")],"biochemistry:covalent-hydrogen":[a("What determines whether a covalent bond is polar?","The number of shared electron pairs","A difference in electronegativity between the bonded atoms","Whether the bond can rotate freely","The mass difference between the two atoms sharing the electron pair","b","Unequal electron sharing arises from an electronegativity difference, giving partial charges on the two atoms.","Bond polarity"),a("A hydrogen bond in a protein forms between which pair?","Two carbon atoms that lie close together in the folded polypeptide chain","A hydrogen bonded to nitrogen or oxygen, and another electronegative atom","Two hydrogens on adjacent side chains that lie close together in the folded chain","A hydrogen and a nonpolar methyl group on a neighbouring amino acid side chain","b","Hydrogen bonds require a hydrogen covalently attached to an electronegative donor plus an electronegative acceptor.","Hydrogen bonds"),a("Approximately how does the strength of a single hydrogen bond compare to a covalent C-C bond?","About the same","Roughly ten to twenty times weaker","Roughly twice as strong","Hydrogen bonds are stronger but shorter lived","b","Hydrogen bonds run a few kcal per mole against about 80 for a C-C bond, which is why they break and reform at body temperature.","Bond energies"),a("Why do nonpolar molecules cluster together in water?","They are attracted to each other by strong covalent forces that exclude water molecules","Clustering minimizes disruption of water hydrogen bonding, which is entropically favorable","Water actively pushes them together with ionic repulsion from dissolved salts","They form hydrogen bonds with one another that water molecules cannot compete with","b","The hydrophobic effect is driven largely by the entropy of water, not by attraction between the nonpolar groups themselves.","Hydrophobic effect"),a("A weak acid has a pKa of 6.0. At pH 8.0, the molecule is predominantly in which form?","Protonated","Deprotonated","Exactly half protonated","Uncharged regardless of pH","b","Two pH units above the pKa leaves roughly 99 percent deprotonated. At pH equal to pKa the split would be even.","pH and pKa"),a("What makes a solution a good buffer?","It contains only a strong acid","The pH is far from the pKa of its components","It contains a weak acid and its conjugate base near the pKa","It contains no ionizable groups","c","Buffering is strongest within about one pH unit of the pKa, where both acid and conjugate base are plentiful.","Buffers"),a("Which functional group carries a negative charge at physiological pH?","Hydroxyl","Carboxyl","Methyl","Amino","b","Carboxyl groups have pKa values near 4 and are deprotonated at pH 7. Amino groups are protonated and positive.","Functional groups"),a("Van der Waals interactions become repulsive when atoms are what?","Separated by more than a few nanometers","Pushed closer than the sum of their van der Waals radii","Oppositely charged","Joined by a hydrogen bond","b","The interaction is attractive at an optimal distance but sharply repulsive once electron clouds overlap.","Van der Waals")],"biochemistry:macromolecules":[a("Polymers of all four major macromolecule classes are assembled by which type of reaction?","Hydrolysis","Condensation, releasing water","Oxidation of the monomer","Phosphorylation of the growing chain","b","Adding a monomer removes the elements of water. Hydrolysis is the reverse reaction that breaks polymers apart.","Polymerization"),a("What distinguishes a saturated from an unsaturated fatty acid?","Chain length","The presence of carbon-carbon double bonds","The presence of a phosphate head group","Whether it is charged at pH 7","b","Unsaturated chains contain double bonds that kink the tail, lowering melting point and increasing membrane fluidity.","Lipids"),a("Why do phospholipids spontaneously form bilayers in water?","They are entirely hydrophobic","They are entirely hydrophilic","They are amphipathic, so tails cluster inward while heads face water","Covalent bonds link neighboring molecules into a continuous two layer sheet","c","The amphipathic structure makes the bilayer the arrangement that best satisfies both ends in aqueous solution.","Membranes"),a("Two glucose molecules joined by a glycosidic bond form what?","A triglyceride","A disaccharide","A nucleotide","A dipeptide","b","Glycosidic linkages join sugars. Maltose, sucrose, and lactose are all disaccharides.","Carbohydrates"),a("Which three parts make up a nucleotide?","An amino group, a carboxyl group, and a variable side chain on one carbon","A five-carbon sugar, a nitrogenous base, and one or more phosphates","Glycerol, fatty acids, and phosphate","Two sugars and a base","b","Nucleotides are sugar plus base plus phosphate. Removing the phosphate leaves a nucleoside.","Nucleic acids"),a("The backbone of a DNA strand is held together by which linkage?","Hydrogen bonds between bases","Phosphodiester bonds between sugars","Peptide bonds","Glycosidic bonds between bases","b","Phosphodiester bonds join the 3-prime carbon of one sugar to the 5-prime phosphate of the next. Base pairing is hydrogen bonding.","Nucleic acids"),a("What does it mean that a nucleic acid strand has 5-prime to 3-prime polarity?","The two ends are chemically distinct, one with a free phosphate and one with a free hydroxyl","The strand is positively charged at one end and negatively at the other","The strand can only be read in one direction by any enzyme that binds to it","Bases alternate between purines and pyrimidines","a","The distinct ends give the strand direction. Synthesis always adds to the 3-prime hydroxyl.","Strand polarity"),a("Cellulose and starch are both glucose polymers. What accounts for their very different properties?","They contain different sugar monomers","The stereochemistry of the glycosidic linkage differs","Cellulose contains nitrogen","Starch is a protein-sugar hybrid","b","Beta linkages in cellulose give straight, hydrogen-bonded fibers, while alpha linkages in starch give a helical, digestible polymer.","Carbohydrates")],"biochemistry:proteins":[a("Which level of protein structure refers to the amino acid sequence itself?","Primary","Secondary","Tertiary","Quaternary","a","Primary structure is the covalently linked sequence, and it determines all higher levels of folding.","Levels of structure"),a("Alpha helices and beta sheets are stabilized mainly by what?","Disulfide bonds between cysteines","Hydrogen bonds along the polypeptide backbone","Ionic bonds between charged side chains","Hydrophobic side chain packing","b","Secondary structure comes from regular backbone hydrogen bonding, independent of which side chains are present.","Secondary structure"),a("A protein composed of four separate polypeptide chains exhibits which level of structure?","Primary","Secondary","Tertiary","Quaternary","d","Quaternary structure describes the assembly of multiple subunits, as in hemoglobin.","Levels of structure"),a("Where are hydrophobic side chains typically found in a soluble globular protein?","Exposed on the surface","Buried in the interior core","Bound to the peptide backbone","Only at the amino terminus","b","Burying nonpolar residues away from water is a major driving force for folding.","Protein folding"),a("The peptide bond has partial double bond character. What is the main consequence?","It rotates freely","It is planar and rigid, restricting backbone conformations","It carries a full negative charge, which repels neighbouring backbone atoms","It breaks easily at neutral pH","b","Resonance makes the amide planar, so only the flanking bonds rotate. That constraint shapes secondary structure.","Peptide bond"),a("Sickle cell hemoglobin results from replacing a glutamate with a valine. Why is that so disruptive?","It breaks a disulfide bond","It puts a hydrophobic residue on the surface, promoting polymerization","It removes the heme binding site","It shortens the chain by one residue, which distorts the heme binding pocket","b","The exposed hydrophobic patch lets deoxygenated molecules stick together into fibers that deform the cell.","Sickle cell"),a("Heating a protein until it loses activity without breaking peptide bonds is called what?","Hydrolysis","Denaturation","Proteolysis","Translation","b","Denaturation disrupts the non-covalent interactions that hold the fold, leaving primary structure intact.","Denaturation"),a("Anfinsen showed that a denatured ribonuclease could refold and regain activity on its own. What did this establish?","Chaperones are required for all folding, and ribonuclease carries its own bound chaperone","The information for the folded structure is contained in the amino acid sequence","Disulfide bonds are unnecessary, since the chain folds identically without them","Folding requires ATP, which the enzyme carries with it through the denaturation","b","Spontaneous refolding demonstrated that primary structure specifies tertiary structure.","Classic experiments")],"biochemistry:enzymes-atp":[a("How does an enzyme speed up a reaction?","By making an unfavorable reaction favorable","By lowering the activation energy through transition state stabilization","By increasing the effective temperature of the solution around the substrate","By shifting the equilibrium toward product","b","Enzymes lower the energy barrier and reach equilibrium faster. They do not change delta G or the equilibrium position.","Catalysis"),a("A reaction with a positive delta G can be driven forward in a cell by what mechanism?","Adding more enzyme","Coupling it to ATP hydrolysis","Lowering the temperature","Removing the catalyst","b","Coupling to a strongly exergonic reaction makes the summed delta G negative. Enzymes alone cannot do this.","Coupled reactions"),a("Vmax is reached when which condition holds?","Substrate concentration equals Km","All enzyme active sites are saturated with substrate","The inhibitor concentration is maximal","Product concentration equals substrate concentration","b","At saturation, adding substrate cannot increase rate because every active site is occupied.","Enzyme kinetics"),a("What does Km represent?","The maximum rate the reaction reaches once enzyme is fully saturated","The substrate concentration giving half maximal velocity","The total enzyme concentration","The free energy of the reaction","b","Km is a substrate concentration and is often used as a rough inverse measure of affinity.","Enzyme kinetics"),a("A competitive inhibitor has which effect on kinetics?","Raises apparent Km, leaves Vmax unchanged","Lowers Vmax, leaves Km unchanged","Lowers both Km and Vmax","Has no effect on either","a","Competitive inhibitors can be outcompeted by excess substrate, so Vmax is still reachable but more substrate is needed.","Inhibition"),a("Why is ATP hydrolysis so exergonic?","The phosphate bonds are unusually strong, so breaking them releases stored bond energy","Charge repulsion in the triphosphate is relieved and the products are resonance stabilized","ATP contains a high energy carbon to carbon bond that releases energy when broken","Hydrolysis releases heat stored within the ribose ring at the centre of the molecule","b","Product stabilization and relief of electrostatic repulsion, not any special bond, account for the free energy change.","ATP"),a("An allosteric inhibitor acts how?","By binding the active site directly and competing with the normal substrate","By binding a separate site and changing the shape of the active site","By covalently destroying the enzyme","By lowering substrate concentration","b","Allosteric regulators bind elsewhere and shift the enzyme between conformations, a common feedback mechanism.","Allostery"),a("If the delta G of a reaction is negative but the reaction does not occur at a measurable rate, what is the explanation?","The reaction is at equilibrium","The activation energy barrier is too high","The reaction requires ATP","Delta G must be positive after all","b","Thermodynamic favorability says nothing about rate. A large barrier keeps favorable reactions slow until catalyzed.","Kinetics vs thermodynamics")],"biochemistry:respiration":[a("What are the net products of glycolysis from one glucose?","2 pyruvate, 2 ATP, 2 NADH","2 pyruvate, 4 ATP, 4 NADH","6 CO2 and 6 H2O","2 lactate and 4 FADH2","a","Four ATP are made but two are invested, giving a net of two, along with two NADH and two pyruvate.","Glycolysis"),a("Where does the citric acid cycle occur in a eukaryotic cell?","Cytosol","Mitochondrial matrix","Inner mitochondrial membrane","Nucleus","b","The cycle runs in the matrix. The electron transport chain sits in the inner membrane.","Citric acid cycle"),a("What is the main purpose of fermentation?","To generate large amounts of ATP","To regenerate NAD+ so glycolysis can continue","To produce CO2 for the citric acid cycle","To synthesize glucose from pyruvate","b","Without oxygen, NADH must be reoxidized. Fermentation does that, yielding no additional ATP itself.","Fermentation"),a("Substrate-level phosphorylation differs from oxidative phosphorylation in what way?","It requires oxygen as the final electron acceptor before any phosphate can be transferred","ATP is made by direct transfer of a phosphate from a substrate, not by a proton gradient","It occurs only in mitochondria, where the enzymes for phosphate transfer are located","It produces NADH instead of ATP","b","Glycolysis and one step of the citric acid cycle transfer phosphate directly, independent of any gradient.","ATP synthesis"),a("Which molecules carry electrons from the citric acid cycle to the electron transport chain?","ATP and ADP","NADH and FADH2","Pyruvate and lactate","Oxygen and water","b","These reduced carriers deliver electrons to the chain, where their energy drives proton pumping.","Electron carriers"),a("In respiration, what is the ultimate fate of the electrons removed from glucose?","They are stored in ATP","They reduce oxygen to form water","They are incorporated into CO2","They are lost as heat only","b","Oxygen is the terminal electron acceptor. CO2 leaves earlier, in pyruvate oxidation and the citric acid cycle.","Electron flow"),a("A yeast culture is switched from aerobic to anaerobic conditions. What happens to its glucose consumption per ATP produced?","It falls sharply","It rises sharply, because far less ATP is made per glucose","It stays the same","Glucose consumption stops entirely, since fermentation yields no usable ATP","b","Fermentation yields only about two ATP per glucose, so far more glucose must be burned, the Pasteur effect.","Aerobic vs anaerobic"),a("Which stage releases the CO2 that you exhale?","Glycolysis only","Pyruvate oxidation and the citric acid cycle","The electron transport chain","Fermentation in muscle","b","Decarboxylation reactions in pyruvate oxidation and the cycle release the carbons of glucose as CO2.","Carbon flow")],"biochemistry:photosynthesis":[a("What does the chemiosmotic hypothesis propose?","ATP is made by direct phosphate transfer from NADH","A proton gradient across a membrane stores the energy used to make ATP","Electrons are stored in the membrane itself","Oxygen is consumed to phosphorylate ADP directly at the membrane surface","b","Mitchell proposed that electron transport pumps protons, and the resulting gradient drives ATP synthase.","Chemiosmosis"),a("Adding an uncoupler that carries protons across the inner mitochondrial membrane has what effect?","Electron transport stops while ATP synthesis continues from the stored gradient","Electron transport continues while ATP synthesis stops and energy is lost as heat","Both electron transport and ATP synthesis stop as soon as the uncoupler is added","ATP synthesis doubles because protons now reach the synthase from both directions","b","Collapsing the gradient decouples the chain from ATP synthase. The chain runs on, releasing heat.","Uncouplers"),a("ATP synthase produces ATP by what means?","Hydrolyzing NADH directly","Allowing protons to flow down their gradient through the enzyme","Pumping protons against their gradient using energy released from NADH","Oxidizing water","b","Proton flow through the channel drives rotation and conformational changes that condense ADP with phosphate.","ATP synthase"),a("In the light reactions, where do the electrons that replace those lost by photosystem II come from?","NADPH","Water, which is split to release oxygen","CO2","ATP hydrolysis in the stroma, which regenerates the reaction centre pigment","b","Splitting water supplies electrons to PSII and releases the O2 in the atmosphere.","Light reactions"),a("What are the main products of the light reactions that the Calvin cycle consumes?","Glucose and oxygen","ATP and NADPH","CO2 and water","Pyruvate and NADH","b","The light reactions capture energy as ATP and reducing power as NADPH for carbon fixation.","Light reactions"),a("Rubisco catalyzes which step?","Splitting water","Attaching CO2 to ribulose bisphosphate","Reducing NADP+","Pumping protons into the thylakoid lumen","b","Rubisco fixes CO2 onto a five-carbon acceptor, the first committed step of the Calvin cycle.","Calvin cycle"),a("In chloroplasts, protons accumulate in which compartment during the light reactions?","The stroma","The thylakoid lumen","The intermembrane space","The cytosol","b","Electron transport pumps protons into the lumen, and they flow back into the stroma through ATP synthase.","Chloroplast structure"),a("Why is the Calvin cycle often called the dark reaction, and why is that name misleading?","It cannot occur in light, because the enzymes are inactivated by illuminated thylakoids","It does not directly require light, but it depends on ATP and NADPH made in the light","It occurs only at night in all plants, once the light reactions have shut down","It requires darkness to activate rubisco, which is inhibited by bright light","b","No photons are used directly, but the cycle stalls without the products of the light reactions, so it stops in darkness.","Calvin cycle")],"molecular-biology:dna-structure":[a("Avery, MacLeod, and McCarty identified the transforming principle by which approach?","Labeling the phage coat with radioactive isotopes and tracking which label entered cells","Destroying protein, RNA, or DNA in turn and testing which loss abolished transformation","Crystallizing the transforming substance and taking X-ray diffraction images of it","Sequencing the pneumococcal genome and comparing the smooth and rough strains directly","b","Selective enzymatic destruction showed only DNase abolished transformation, implicating DNA.","Classic experiments"),a("Hershey and Chase labeled phage protein with sulfur-35 and DNA with phosphorus-32. What did they find?","Sulfur entered the bacteria while the phosphorus label stayed in the coats","Phosphorus entered the bacteria while sulfur stayed outside","Both labels entered equally","Neither label entered","b","The DNA label went in and directed production of new phage, while the protein coat remained outside.","Classic experiments"),a("Chargaff rules state which relationship?","A equals G and C equals T","A equals T and G equals C","All four bases occur in equal amounts in every species","Purine content varies independently of pyrimidine content","b","Equal amounts of A and T, and of G and C, hinted at specific pairing before the structure was solved.","Chargaff rules"),a("What did Rosalind Franklin X-ray diffraction data contribute?","The exact base sequence of DNA","Evidence for a helical molecule with regular repeat distances","Proof that DNA rather than protein carries the genetic information","The number of chromosomes in a human cell","b","The diffraction pattern gave helical parameters and dimensions essential to building the correct model.","Classic experiments"),a("The two strands of a DNA double helix are antiparallel. What does that mean?","They have identical sequences read in the same direction from each of the two ends","One runs 5-prime to 3-prime while the complementary strand runs 3-prime to 5-prime","They are held together by covalent bonds running between the paired bases","They rotate in opposite directions around the central axis of the helix","b","Opposite polarity is required for proper base pairing and has major consequences for replication.","Helix structure"),a("Which forces hold the two strands of DNA together?","Phosphodiester bonds linking the phosphate of one strand to the sugar of the other","Hydrogen bonds between base pairs plus base stacking interactions","Disulfide bridges formed between bases on the two complementary strands","Peptide bonds joining the sugar of one strand to the base of the other","b","Two hydrogen bonds for A-T, three for G-C, plus stacking of the aromatic bases in the core.","Base pairing"),a("A DNA sample with a high GC content requires a higher temperature to melt. Why?","GC pairs have three hydrogen bonds rather than two","GC pairs are covalently linked, so heat cannot separate them easily","GC pairs are larger and heavier","GC-rich DNA is single stranded","a","The extra hydrogen bond, along with stacking, makes GC-rich duplexes more thermally stable.","DNA melting"),a("Griffith experiment with rough and smooth pneumococcus demonstrated what?","That protein is the genetic material, since heat destroys DNA but leaves protein active","That something from heat-killed virulent bacteria could transform live avirulent bacteria","That bacteria undergo meiosis, allowing traits to be exchanged between the two strains","That DNA is double stranded","b","Griffith showed transformation occurred but did not identify the substance responsible.","Classic experiments")],"molecular-biology:dna-replication":[a("Meselson and Stahl used density labeling to distinguish among replication models. Their result supported which one?","Conservative","Semiconservative","Dispersive","Random fragmentation","b","After one round all DNA was hybrid density, ruling out conservative replication, and after two rounds hybrid and light bands appeared, ruling out dispersive.","Meselson-Stahl"),a("DNA polymerase can only add nucleotides to what?","A free 5-prime phosphate","A free 3-prime hydroxyl group","Any position in the strand","The template strand directly","b","This requirement forces 5-prime to 3-prime synthesis and creates the need for primers and lagging strand fragments.","DNA polymerase"),a("Why is the lagging strand synthesized in short fragments?","DNA polymerase works slowly on that strand, so the product breaks apart before it can be extended","The template runs in the wrong direction relative to fork movement, so synthesis restarts repeatedly","There is a shortage of free nucleotides near the fork, which forces synthesis to pause and then restart","Ligase cuts the strand into pieces that are rejoined once copying finishes","b","Because synthesis must go 5-prime to 3-prime, the lagging strand is built backwards in Okazaki fragments as the fork opens.","Lagging strand"),a("What is the role of primase?","Unwinding the double helix so the template strands can be copied separately","Laying down a short RNA primer with a 3-prime hydroxyl","Joining Okazaki fragments","Proofreading newly made DNA","b","DNA polymerase cannot start a chain, so primase provides an RNA primer that is later replaced.","Priming"),a("Which enzyme seals the nick between adjacent Okazaki fragments?","Helicase","DNA ligase","Primase","Topoisomerase","b","Ligase forms the final phosphodiester bond after the RNA prim rary?","It produces overlapping fragments large enough to cover the genome without gaps","It guarantees complete cleavage at every site, giving fragments of predictable size","It avoids the need for a vector, since the fragments circularise on their own","It removes repetitive DNA, leaving only the sequences that encode proteins","a","Limiting the digest gives random overlapping fragments, so genes are not always cut through the middle.","Library construction"),a("Library complexity refers to what?","The number of independent clones needed to give a high probability of covering every sequence","The number of restriction enzymes used to build the library and screen its clones for inserts","How difficult the library is to screen once the clones have been transferred to filters","The size of the vector","a","Coverage depends on insert size and genome size, and low complexity means some sequences are missing.","Complexity"),a("In colony hybridization, what is transferred to a filter?","The colonies themselves are lifted and their DNA is denatured and bound","Only the plasmids, purified in advance and spotted onto the filter by hand","Protein from each colony","Live bacteria that grow on the filter","a","The replica lift immobilizes denatured DNA so a labeled probe can find the matching clone.","Screening"),a("A labeled probe finds its target by which principle?","Antibody recognition","Complementary base pairing to the target sequence","Enzymatic cleavage of the target wherever the two sequences match","Binding to the vector backbone","b","Hybridization is sequence specific, which is why probe design determines what you find.","Probes"),a("Raising the wash temperature or lowering the salt during hybridization does what?","Increases stringency, so only closely matched duplexes survive","Decreases stringency, allowing more mismatches","Has no effect on hybridization","Destroys the filter bound DNA","a","High stringency finds exact matches, while lower stringency can pick Priming"),a("Two cDNA libraries made from liver and brain differ in what way?","They contain different genomic sequences","They represent the different sets of genes transcribed in each tissue","One contains introns and the other does not, because splicing differs by tissue","Only the vector differs","b","cDNA representation mirrors expression, so tissue-specific transcripts appear only in the matching library.","Tissue specificity"),a("You want to study the promoter and intron structure of a human gene. Which library should you screen?","A cDNA library","A genomic library","An expression library","Either, since they contain the same sequences","b","Regulatory regions and introns are absent from cDNA and present only in genomic clones.","Choosing a library"),a("An expression library is screened with what reagent?","A labeled DNA probe complementary to part of the cloned coding sequence","An antibody that recognizes the protein product","A restriction enzyme","A poly-A tail","b","The vector drives translation of the insert, so immunological detection identifies the right clone.","Expression libraries"),a("For an expression library to work, the insert must be cloned how?","In the correct reading frame and orientation downstream of a promoter","In any orientation, since the bacterium corrects the reading frame","Without a promoter, since the host supplies one wherever the insert lands","With its introns intact, so the bacterium can splice the transcript itself","a","Only one of six possible arrangements produces the intended protein, so many clones must be screened.","Expression libraries"),a("A eukaryotic gene fails to produce functional protein when its genomic clone is expressed in E. coli. What is the most likely reason?","Bacteria cannot splice out the introns","The gene is too small","Bacteria lack ribosomes","The promoter is too strong","a","Prokaryotes lack the spliceosome, which is why cDNA is used for expression in bacteria.","Expression problems")],"recombinant-dna:gel-seq-pcr":[a("In agarose gel electrophoresis, DNA fragments separate according to what?","Base composition","Size, with smaller fragments migrating faster","Charge, since larger fragments are more positive","Melting temperature","b","The uniform negative charge per length means the gel matrix sorts fragments almost purely by size.","Gel electrophoresis"),a("DNA migrates toward which electrode and why?","The negative electrode, because the bases carry a net positive charge","The positive electrode, because the phosphate backbone is negatively charged","Neither, DNA does not move in an electric field","It depends on the buffer pH","b","The phosphates give DNA a uniform negative charge at neutral pH.","Gel electrophoresis"),a("A 5 kb plasmid cut with EcoRI gives bands at 3 kb and 2 kb. How many EcoRI sites does it contain?","One","Two","Three","None","b","A circular molecule needs two cuts to produce two linear fragments. One cut would give a single 5 kb band.","Restriction mapping"),a("Sanger sequencing depends on which reagent?","Restriction enzymes that cut the template at intervals matching each base in the sequence","Dideoxynucleotides that terminate chain elongation when incorporated","Reverse transcriptase, which copies the template into a complementary strand","Ligase, which seals each new fragment onto the growing chain","b","Lacking a 3-prime hydroxyl, a ddNTP stops synthesis, generating a nested set of fragments.","Sanger sequencing"),a("On a Sanger sequencing gel, the sequence is read in which direction?","From the largest fragments at the top downward, giving 5-prime to 3-prime","From the smallest fragments at the bottom upward, giving 5-prime to 3-prime","Right to left across the lanes","It cannot be read directly from the gel","b","The shortest fragment corresponds to the first base added after the primer.","Reading a sequencing gel"),a("What are the three steps of one PCR cycle, in order?","Denature, anneal, extend","Anneal, denature, extend","Extend, denature, anneal","Denature, extend, anneal","a","Heat separates the strands, cooling lets primers bind, then polymerase extends them.","PCR steps"),a("Why must PCR use a thermostable polymerase such as Taq?","It works faster than other polymerases and therefore finishes more cycles","It survives the repeated high temperature denaturation steps","It does not require primers","It has no proofreading activity","b","Before Taq, fresh enzyme had to be added each cycle because heat destroyed it.","PCR"),a("After 20 cycles of PCR, roughly how many copies arise from a single template?","20","400","About a million","About a thousand","c","Amplification is exponential, and two to the twentieth power is just over a million.","PCR amplification"),a("To amplify a specific region by PCR, what do you need to know?","The full sequence of the region, so the polymerase can be primed internally","Enough sequence at each end to design two flanking primers","Only the length of the region","The restriction map alone","b","Primers define the boundaries, so only the flanking sequences must be known.","Primer design")]},xd={"biochemistry:types-organisms":[a("Which structure is found in plant cells but not animal cells?","Mitochondrion","Chloroplast","Ribosome","Nucleus","b","Chloroplasts carry out photosynthesis and are absent from animal cells, which still have mitochondria.","Organelles"),a("The surface area to volume ratio changes how as a cell gets larger?","It increases, so a larger cell exchanges material with its surroundings more easily","It decreases, limiting exchange with the environment","It stays constant","It becomes zero","b","Volume grows faster than surface area, which is a major constraint on cell size.","Cell size"),a("Which organelle is the primary site of protein synthesis destined for secretion?","Smooth endoplasmic reticulum","Rough endoplasmic reticulum","Peroxisome","Nucleolus","b","Ribosomes studding the rough ER translate proteins directly into the ER lumen for the secretory pathway.","Organelles"),a("Yeast is often chosen over E. coli to study eukaryotic processes because what?","It grows faster than bacteria and needs no defined medium for routine laboratory work","It is a single celled eukaryote with a nucleus and organelles but still easy genetics","It has no cell wall, so foreign DNA enters without special treatment","Its genome is larger than the human genome, making screens more thorough","b","Yeast combines eukaryotic cell biology with the convenience of microbial culture and screens.","Model organisms"),a("What is the approximate diameter of a typical bacterial cell?","One micrometer","One millimeter","One nanometer","One centimeter","a","Bacteria are on the order of a micrometer, while eukaryotic cells are typically ten to a hundred times larger in diameter.","Cell size"),a("Which statement about the nucleolus is correct?","It is a membrane bound organelle that isolates ribosome assembly from the cytosol","It is the site of ribosomal RNA synthesis and ribosome assembly","It stores DNA repair enzymes","It is found in bacteria","b","The nucleolus is a dense subregion of the nucleus, not separately membrane bound.","Organelles"),a("Compartmentalization gives eukaryotic cells which advantage?","Faster DNA replication, because each compartment can copy its own chromosome at once","Incompatible reactions can occur simultaneously in separate environments","A smaller genome, since enzymes shared between compartments need only one copy each","Independence from ATP","b","Separate compartments allow different pH values, enzyme sets, and redox conditions at the same time.","Compartmentalization"),a("A newly discovered microbe has ether-linked membrane lipids and lacks peptidoglycan. Which domain does it most likely belong to?","Bacteria","Archaea","Eukarya","It cannot be assigned","b","Ether-linked lipids are a hallmark of archaea, while bacteria use ester linkages and peptidoglycan walls.","Domains of life")],"biochemistry:covalent-hydrogen":[a("Which of these is the strongest interaction?","A hydrogen bond","A covalent bond","A van der Waals contact","An ion-dipole interaction in water","b","Covalent bonds are roughly an order of magnitude stronger than any of the non-covalent interactions.","Bond energies"),a("Why does ice float on liquid water?","Ice contains dissolved gas trapped during freezing, and those bubbles lower its density","Hydrogen bonding holds molecules in an open lattice that is less dense than liquid water","Ice has a higher molecular weight than water because the molecules pack closer","Water expands when it loses hydrogen bonds during the transition to a solid","b","The regular hydrogen bonded lattice spaces molecules farther apart than in the liquid.","Properties of water"),a("At physiological pH, the side chain of lysine is in what state?","Protonated and positively charged","Deprotonated and negatively charged","Uncharged and nonpolar","Covalently modified","a","Lysine has a side chain pKa near 10.5, so it remains protonated at pH 7.","Functional groups"),a("What happens to a weak acid when the pH equals its pKa?","It is fully protonated, since the pKa marks the point of complete binding","It is fully deprotonated","Half the molecules are protonated and half are not","It stops ionizing","c","This is the definition of pKa and the point of maximum buffering capacity.","pH and pKa"),a("Which interaction is responsible for holding a sodium ion in solution?","Covalent bonding to water","Ion-dipole interactions with the partial charges of water molecules","Hydrogen bonding between the sodium ion and the oxygen of nearby water","Hydrophobic exclusion","b","The polar water molecules orient their partial charges around the ion, forming a hydration shell.","Solvation"),a("A molecule with many hydroxyl groups is likely to be what?","Hydrophobic and membrane bound","Hydrophilic and water soluble","Charged at all pH values","Unable to form hydrogen bonds","b","Hydroxyls both donate and accept hydrogen bonds, favoring interaction with water.","Solubility"),a("Why can a single water molecule participate in up to four hydrogen bonds?","It has four hydrogen atoms","It has two hydrogens to donate and two lone pairs on oxygen to accept","It is tetrahedral in shape only when frozen into the crystal lattice of ice","It bonds covalently to neighbors","b","Two donors and two acceptors per molecule create the extensive network responsible for water properties.","Hydrogen bonds"),a("Adding a strong acid to a well buffered solution produces what result?","The pH plummets immediately, since a buffer only resists added base","The conjugate base absorbs protons and the pH changes only slightly","The buffer is converted into a strong base that neutralizes the added acid","The pH rises, because the added protons are captured by the conjugate acid","b","Buffering works because the conjugate base soaks up added protons until it is exhausted.","Buffers")],"biochemistry:macromolecules":[a("Which macromolecule class is not built from a repeating monomer in a linear polymer?","Proteins","Nucleic acids","Lipids","Polysaccharides","c","Lipids assemble by non-covalent aggregation rather than by polymerization of monomers.","Macromolecule classes"),a("A triglyceride consists of what?","Glycerol plus three fatty acids","Glycerol plus two fatty acids and a phosphate","Three glycerols and one fatty acid","A sterol ring plus fatty acids","a","Replacing one fatty acid with a phosphate head group gives a phospholipid instead.","Lipids"),a("Cholesterol affects membranes in what way?","It makes membranes uniformly more fluid at every temperature the cell encounters","It moderates fluidity, reducing it at high temperature and preventing packing at low temperature","It converts the bilayer into a monolayer at high temperature only","It blocks all transport across the bilayer once the membrane has become rigid","b","Its rigid ring system buffers the membrane against temperature-driven changes in fluidity.","Membranes"),a("Which best explains why membranes are described as a fluid mosaic?","Lipids and proteins are covalently locked in place within a rigid sheet","Lipids and many proteins diffuse laterally within a two dimensional sheet","The membrane is a rigid crystal","Proteins float freely in the cytoplasm","b","Lateral mobility within the plane, with limited flipping between leaflets, defines the model.","Membranes"),a("Glycogen and starch serve which primary role?","Structural support","Short term glucose storage","Genetic information storage","Catalysis","b","Both are branched glucose polymers that can be mobilized quickly for energy.","Carbohydrates"),a("Which is a purine?","Cytosine","Thymine","Adenine","Uracil","c","Adenine and guanine are double ring purines. The rest are single ring pyrimidines.","Nucleic acids"),a("RNA differs from DNA in which respects?","Ribose instead of deoxyribose, and uracil instead of thymine","Ribose instead of deoxyribose, with thymine retained in both molecules","It has no phosphate backbone","It cannot base pair","a","The 2-prime hydroxyl and the substitution of uracil for thymine distinguish RNA chemically.","Nucleic acids"),a("Hydrolysis of a polymer requires what?","Removal of water","Addition of water across the bond","Addition of ATP to each monomer","Formation of a covalent crosslink","b","Hydrolysis is the reverse of condensation, splitting the bond by inserting the elements of water.","Polymerization")],"biochemistry:proteins":[a("How many amino acids are commonly used in protein synthesis?","4","20","64","100","b","Twenty standard amino acids are specified by the 64 codons of the genetic code.","Amino acids"),a("What distinguishes one amino acid from another?","The backbone structure","The side chain, or R group","The number of carboxyl groups","The presence of nitrogen","b","All standard amino acids share the same backbone and differ only in side chain chemistry.","Amino acids"),a("A disulfide bond forms between the side chains of which residues?","Two serines","Two cysteines","A lysine and a glutamate","Two prolines","b","Oxidation of two cysteine thiols creates a covalent crosslink that stabilizes many secreted proteins.","Covalent crosslinks"),a("Proline is unusual among amino acids because what?","It has no side chain at all, which leaves the backbone free to rotate at that position","Its side chain bonds back to the backbone nitrogen, restricting flexibility","It carries two amino groups, which lets it form branches in the polypeptide","It cannot form peptide bonds, so it only ever appears at the chain terminus","b","The ring constrains the backbone and often disrupts alpha helices, acting as a helix breaker.","Amino acids"),a("Which pair of side chains would you expect to form a salt bridge?","Leucine and valine","Aspartate and arginine","Alanine and glycine","Phenylalanine and tryptophan","b","A negatively charged carboxylate and a positively charged guanidinium attract electrostatically.","Non-covalent forces"),a("A protein is synthesized in which direction?","Carboxyl terminus to amino terminus","Amino terminus to carboxyl terminus","From the middle outward","Randomly, then edited","b","By convention sequences are written and synthesized from the N terminus to the C terminus.","Polypeptide direction"),a("Molecular chaperones assist folding by which mechanism?","Forming permanent covalent bonds with the substrate","Binding exposed hydrophobic surfaces to prevent aggregation while folding proceeds","Determining the final tertiary structure independently of the sequence","Cutting misfolded proteins into fragments","b","Chaperones improve folding yield but the sequence still specifies the final structure.","Chaperones"),a("Which experimental change would most likely denature a protein without breaking peptide bonds?","Adding a protease","Adding urea at high concentration","Adding more of the same protein","Lowering the salt concentration slightly","b","Urea disrupts hydrogen bonding and the hydrophobic effect, unfolding the chain while leaving the backbone intact.","Denaturation")],"biochemistry:enzymes-atp":[a("The induced fit model proposes what?","The active site is rigid and preformed","Substrate binding causes a conformational change that improves catalysis","Enzymes are consumed by the reaction","Substrates must be covalently modified before they are able to bind the site","b","The enzyme molds around the substrate rather than acting as a fixed lock.","Active site"),a("An enzyme is added to a reaction at equilibrium. What happens?","Product accumulates further, since the enzyme lowers the barrier in one direction only","Nothing changes in the final concentrations, equilibrium is unaffected","The reaction reverses, since the enzyme favours the direction with less product","Delta G becomes more negative, so the reaction releases more usable energy","b","Catalysts speed both directions equally, so equilibrium position is untouched.","Catalysis"),a("Feedback inhibition typically means what?","The first substrate inhibits the last enzyme","The end product of a pathway inhibits an early enzyme in that pathway","Products always activate their own synthesis by binding the first enzyme","Enzymes degrade after one cycle","b","Shutting down the committed step when product is plentiful prevents waste.","Regulation"),a("A noncompetitive inhibitor has what effect on Vmax and Km?","Vmax decreases while Km is unchanged","Km increases while Vmax is unchanged","Both increase","Both are unchanged","a","Because it does not compete for the active site, excess substrate cannot overcome it.","Inhibition"),a("Which statement about delta G is correct?","A negative delta G means the reaction proceeds quickly once it has started","A negative delta G means the reaction is spontaneous in that direction","Delta G depends only on temperature","Enzymes make delta G more negative","b","Spontaneity and rate are separate. Enzymes affect rate only.","Thermodynamics"),a("Coenzymes such as NAD+ function as what?","Permanent parts of the polypeptide chain that are added during protein folding","Small molecules that carry electrons or chemical groups between reactions","Inhibitors of their own enzymes once the reaction products have accumulated","Structural scaffolds only, holding the subunits of an enzyme complex together","b","They shuttle groups or electrons, being regenerated by other reactions in the cell.","Cofactors"),a("Raising temperature increases enzyme rate up to a point, then activity drops sharply. Why?","Substrate is exhausted","The enzyme denatures above its stability limit","The activation energy rises above what the substrate can supply","The pH shifts to zero","b","Kinetic energy helps until the fold unravels, at which point catalysis is lost.","Enzyme stability"),a("Which observation would suggest an enzyme is allosterically regulated?","Michaelis-Menten hyperbolic kinetics measured across a range of substrate","Sigmoidal kinetics indicating cooperative substrate binding","No response to inhibitors","A Km equal to Vmax","b","Cooperativity between subunits produces an S shaped velocity curve rather than a hyperbola.","Allostery")],"biochemistry:respiration":[a("Glycolysis occurs where in the cell?","Cytosol","Mitochondrial matrix","Inner mitochondrial membrane","Nucleus","a","Glycolysis is cytosolic and does not require oxygen or mitochondria.","Glycolysis"),a("In alcoholic fermentation, pyruvate is converted to what?","Lactate","Ethanol and carbon dioxide","Acetyl CoA and carbon dioxide, which then enter the citric acid cycle","Citrate","b","Yeast decarboxylates pyruvate to acetaldehyde, then reduces it to ethanol, regenerating NAD+.","Fermentation"),a("What links glycolysis to the citric acid cycle?","Conversion of pyruvate to acetyl CoA with release of CO2","Direct entry of glucose into the cycle once it has been phosphorylated","Reduction of oxygen to water","Phosphorylation of ADP","a","Pyruvate dehydrogenase produces acetyl CoA and NADH, connecting the two stages.","Pyruvate oxidation"),a("How many carbons enter the citric acid cycle per acetyl CoA and how many leave as CO2?","Two enter and two leave","Four enter and two leave","Two enter and four leave","Six enter and six leave","a","The two acetyl carbons balance the two CO2 released per turn, regenerating oxaloacetate.","Citric acid cycle"),a("Why must NADH be reoxidized for glycolysis to continue?","NADH inhibits hexokinase directly, shutting the pathway down at its very first step","The cell has a limited pool of NAD+ that is required as an electron acceptor","NADH is toxic to the cell once it accumulates beyond a low threshold","NAD+ is consumed during ATP synthesis and has to be replaced from the diet","b","With the pool fully reduced, the oxidation step of glycolysis stalls.","Redox balance"),a("Complete oxidation of one glucose yields approximately how many ATP in a eukaryotic cell?","2","4","30 to 32","100","c","Estimates hover around 30 to 32 ATP, most from oxidative phosphorylation.","ATP yield"),a("Muscle cells producing lactate during intense exercise are doing what?","Running the citric acid cycle faster","Fermenting to regenerate NAD+ when oxygen supply lags demand","Making more ATP per glucose than they would under aerobic conditions","Halting glycolysis entirely","b","Lactate fermentation keeps glycolysis running when the electron transport chain cannot keep pace.","Fermentation"),a("If a cell is given a poison that blocks the citric acid cycle, what happens to glycolysis in the short term?","It stops immediately","It can continue if NAD+ is regenerated by fermentation","It speeds up indefinitely with no consequence","It reverses to make glucose","b","Glycolysis needs only NAD+ regeneration, which fermentation can supply independently of the cycle.","Metabolic integration")],"biochemistry:photosynthesis":[a("The proton motive force consists of which components?","A pH gradient and a membrane voltage","Only a concentration gradient of ATP","A temperature difference across the membrane","A gradient of oxygen","a","Both the chemical gradient of protons and the electrical potential contribute to the stored energy.","Chemiosmosis"),a("Which complex is the direct target of cyanide in the mitochondrial electron transport chain?","ATP synthase","Cytochrome c oxidase, the terminal complex","Pyruvate dehydrogenase, which feeds the chain its electrons","Rubisco","b","Blocking electron transfer to oxygen stops the chain and collapses ATP production.","Inhibitors"),a("Photosystem I and photosystem II are named for what reason?","The order in which electrons flow through them","The order in which they were discovered","Their position in the thylakoid membrane","The number of chlorophyll molecules each contains","b","Confusingly, electrons flow from PSII to PSI, opposite to the naming order.","Light reactions"),a("Where does carbon fixation occur in the chloroplast?","Thylakoid lumen","Stroma","Inner membrane","Outer membrane","b","The Calvin cycle enzymes, including rubisco, are soluble in the stroma.","Calvin cycle"),a("Which molecule is the immediate acceptor of CO2 in the Calvin cycle?","Glucose","Ribulose bisphosphate","Pyruvate","NADPH","b","Rubisco attaches CO2 to the five carbon RuBP, yielding two three-carbon molecules.","Calvin cycle"),a("How many CO2 molecules must be fixed to make one molecule of glucose?","Three","Six","Twelve","One","b","Each turn fixes one carbon, so six turns supply the six carbons of glucose.","Calvin cycle"),a("Chlorophyll appears green because it does what?","Absorbs green light strongly","Absorbs blue and red light and reflects green","Emits green light","Converts all wavelengths to green","b","The absorption spectrum has peaks in blue and red, leaving green to be reflected.","Pigments"),a("An experiment shows ATP synthesis in isolated chloroplasts placed in the dark after an artificial pH jump. What does this support?","Light is directly required for ATP synthase to work","A proton gradient alone is sufficient to drive ATP synthesis","ATP synthase requires NADPH","Photosystem II is the site of ATP synthesis","b","The Jagendorf acid bath experiment showed the gradient, not light itself, powers the synthase.","Classic experiments")],"molecular-biology:dna-structure":[a("Which pairing is correct in DNA?","Adenine with guanine","Adenine with thymine","Cytosine with thymine","Guanine with uracil","b","Purine pairs with pyrimidine, A with T and G with C, keeping the helix width uniform.","Base pairing"),a("If a DNA sample is 30 percent adenine, what percent is guanine?","30","20","40","15","b","A equals T at 30 each, leaving 40 percent split evenly between G and C, so 20 percent guanine.","Chargaff rules"),a("How many hydrogen bonds join a guanine-cytosine pair?","One","Two","Three","Four","c","Three hydrogen bonds make GC pairs more stable than the two-bond AT pairs.","Base pairing"),a("A purine always pairs with a pyrimidine. Why does this matter structurally?","It makes the helix uniform in diameter","It allows the strands to run in parallel","It determines the direction of replication","It creates the phosphodiester backbone","a","Pairing a two-ring base with a one-ring base keeps the rungs a constant width along the helix.","Helix structure"),a("The bases in the double helix are located where?","On the outside, exposed to solvent","On the inside, stacked and shielded from water","Attached to the phosphates directly","Alternating inside and outside","b","Hydrophobic bases stack in the core while the charged backbone faces the aqueous surroundings.","Helix structure"),a("Denaturing DNA by heating and then cooling slowly allows what to happen?","Permanent destruction of the strands, since the bases cannot repair themselves","Renaturation, as complementary strands find each other and reanneal","Conversion of DNA to RNA","Ligation of the backbone","b","Reannealing underlies hybridization techniques such as probing and PCR.","DNA melting"),a("Proteins were considered the likely genetic material before the 1940s primarily because what?","They are found only in the nucleus, where the genetic material was already known to be located","They have twenty different subunits and seemed more capable of carrying complex information","They replicate faster than DNA, so they could keep pace with rapidly dividing cells","They form double helices capable of pairing during every cell division","b","DNA with only four bases seemed too monotonous to encode the diversity of life.","History"),a("Transformation in Griffith experiment required which condition?","Live virulent bacteria only","Heat-killed virulent bacteria together with live avirulent bacteria","Two strains of live avirulent bacteria","Purified protein from the virulent strain added to live avirulent bacteria","b","Neither component alone killed the mice, but the combination produced virulent bacteria.","Classic experiments")],"molecular-biology:dna-replication":[a("Replication of a bacterial chromosome begins where?","At random points throughout the genome","At a defined origin of replication","Only at the telomeres","At the ribosome binding site","b","A specific origin sequence is recognized by initiator proteins that open the duplex.","Origins"),a("Eukaryotic chromosomes have many origins rather than one. Why?","Eukaryotic polymerase is slower and the genomes are much larger","Eukaryotic DNA is single stranded","To allow replication to proceed without unwinding the chromosome ahead of it","Because they lack helicase","a","Multiple origins fire in parallel so the large genome can be copied within one S phase.","Origins"),a("What is the immediate consequence of losing DNA polymerase proofreading activity?","Replication stops","The mutation rate rises substantially","The strands cannot separate","Okazaki fragments are not made","b","Errors that would normally be excised are left in place, increasing mismatches by orders of magnitude.","Fidelity"),a("Topoisomerase performs which function?","Joining Okazaki fragments together once their RNA primers have been removed","Relieving supercoiling generated ahead of the replication fork","Adding RNA primers","Removing mismatched bases","b","Unwinding creates torsional strain that topoisomerase releases by cutting and resealing the backbone.","Fork enzymes"),a("Replication is described as bidirectional. What does that mean?","Both strands are copied in the same direction","Two forks move away from the origin in opposite directions","DNA polymerase can work 3-prime to 5-prime","The lagging strand is copied backwards overall","b","Two forks emanate from each origin, forming a replication bubble that expands in both directions.","Replication forks"),a("In the Meselson-Stahl experiment, what was the result after two rounds in light medium?","All DNA at hybrid density","Half hybrid and half light density","All DNA at heavy density","All DNA at light density","b","Semiconservative replication predicts exactly this mix, which is what was observed.","Meselson-Stahl"),a("Why must the RNA primer eventually be removed?","RNA in the final product would leave the DNA sequence incomplete and unstable","RNA blocks the ribosome from reading the message copied off that region of the chromosome","RNA cannot base pair with DNA, so the primer would leave an unpaired gap in the duplex","Ligase cannot work on DNA that still carries a primer at its 5 prime end","a","Primers are excised and replaced with DNA before ligase seals the strand.","Priming"),a("Which enzyme extends chromosome ends using an internal RNA template?","Ligase","Telomerase","Primase","Topoisomerase","b","Telomerase carries its own RNA template and adds repeats, offsetting end replication loss.","Telomeres")],"molecular-biology:transcription-translation":[a("Transcription begins when RNA polymerase binds to what?","The operator","The promoter","The term
